name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `folder` has no entry in home-assistant/brands and this repo ships
          # no brand assets, so the brands check can never pass. It only gates
          # inclusion in the HACS default store, which a custom component
          # overriding a core domain is not eligible for anyway.
          ignore: brands
